<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#12375d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Croce Gialla">
<title>Croce Gialla Volontari</title>
<link rel="manifest" href="/gestionale-croce-gialla/manifest-volontari.webmanifest?v=stable-20260929">
<link rel="apple-touch-icon" sizes="180x180" href="/gestionale-croce-gialla/icons/icon-192-v6.png?v=stable-20260929">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f2f5f8;color:#12375d;font:16px system-ui,-apple-system,Segoe UI,Arial}
.card{width:min(92vw,430px);background:#fff;border:1px solid #d9e2ea;border-radius:18px;padding:24px;text-align:center;box-shadow:0 10px 35px #12375d18}
h1{font-size:22px;margin:0 0 8px}.badge{display:inline-block;background:#ffdb17;padding:6px 12px;border-radius:999px;font-weight:900;margin:8px 0 14px}
p{color:#64798b}.spin{width:42px;height:42px;border:5px solid #d9e2ea;border-top-color:#12375d;border-radius:50%;margin:18px auto;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
a{display:inline-block;margin-top:8px;background:#12375d;color:#fff;text-decoration:none;padding:12px 18px;border-radius:10px;font-weight:800}
</style>
</head>
<body>
<div class="card">
<h1>Croce Gialla Emergenza</h1>
<div class="badge">APP VOLONTARI · STABILE</div>
<div class="spin"></div>
<p id="status">Apertura dell'app aggiornata…</p>
<a id="manual" href="/gestionale-croce-gialla/?area=volontari&fresh=1" hidden>Apri App Volontari</a>
</div>
<script>
(async()=>{
 const target='/gestionale-croce-gialla/?area=volontari&fresh='+Date.now();
 try{
  if('serviceWorker' in navigator){
   await navigator.serviceWorker.register('/gestionale-croce-gialla/sw.js?v=32',{scope:'/gestionale-croce-gialla/'});
   await navigator.serviceWorker.ready;
  }
 }catch(e){
  console.warn('Service worker non disponibile',e);
 }
 document.getElementById('manual').href=target;
 setTimeout(()=>location.replace(target),250);
 setTimeout(()=>{document.getElementById('manual').hidden=false;document.getElementById('status').textContent='Se l’app non si apre automaticamente, usa il pulsante qui sotto.'},1800);
})();
</script>
</body>
</html>
