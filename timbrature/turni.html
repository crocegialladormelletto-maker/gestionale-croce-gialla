<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Turni Dipendenti - Croce Gialla</title><style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f2f6fb;color:#173b72;margin:0}header{background:#ffdf00;padding:20px;border-bottom:4px solid #173b72}main{max-width:1150px;margin:24px auto;background:#fff;padding:20px;border-radius:14px}button,input,select{font-size:15px;padding:9px;border-radius:7px;border:1px solid #cad4df}button{background:#173b72;color:white;cursor:pointer;margin:4px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}table{border-collapse:collapse;width:100%;margin:16px 0}th,td{border:1px solid #bccada;padding:8px;text-align:center}th{background:#fff3a1}td input{width:90px}td label{font-size:13px}#notice{padding:12px;background:#e9f0fa;margin-top:10px}.hidden{display:none}@media print{.noprint{display:none!important}body{background:white}main{margin:0;max-width:none;padding:0}header{padding:10px}td input{border:0;padding:0;width:75px}th,td{font-size:11px;padding:5px}}
#printSheet{display:none}
@page{size:A4 landscape;margin:6mm}
@media print{
html,body{width:100%!important;height:auto!important;margin:0!important;padding:0!important;overflow:visible!important;background:#fff!important}
header{display:none!important}
main{display:block!important;max-width:none!important;margin:0!important;padding:0!important;background:#fff!important}
#work,#notice{display:none!important}
#printSheet{display:block!important;margin:0!important;padding:0!important;break-inside:avoid!important;page-break-inside:avoid!important}
#printSheet:before{content:"CROCE GIALLA EMERGENZA ODV";display:block;font-size:17pt;font-weight:900;color:#173b72;border-bottom:3px solid #173b72;padding:0 0 7px;margin:0 0 8px}
#printSheet h3{font-size:11pt!important;margin:0 0 8px!important}
#printSheet table{width:100%!important;margin:0!important;border-collapse:collapse!important;table-layout:fixed!important;font-size:9pt!important;break-inside:avoid!important}
#printSheet th,#printSheet td{border:1px solid #b9c8df!important;padding:5px 4px!important;height:37px!important;white-space:nowrap!important;vertical-align:middle!important}
#printSheet thead th{background:#173b72!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#printSheet tbody th{background:#fff3bd!important;color:#173b72!important;text-align:left!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#printSheet tbody tr{height:38px!important;break-inside:avoid!important}
#printSheet tbody tr:last-child th,#printSheet tbody tr:last-child td{background:#ffdf00!important;color:#173b72!important;font-weight:800!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#printSheet .foot{display:none!important}
}.editGrid{table-layout:fixed;margin:18px 0 8px;border-collapse:collapse;width:100%}
.editGrid th,.editGrid td{border:1px solid #b7c9df;padding:10px 7px;text-align:center;vertical-align:middle}
.editGrid thead th{background:#102f5a;color:white;font-size:14px}
.editGrid thead th:first-child{width:24%}
.editGrid tbody th{background:#dceeff;color:#102f5a;text-align:left;font-size:13px}
.editGrid tbody td:nth-child(2){background:#fff6cf}
.editGrid tbody td:nth-child(3){background:#e7f3ff}
.editGrid tbody td:nth-child(4){background:#e6f8e7}
.editGrid .hoursInputs{display:flex;align-items:center;justify-content:center;gap:5px}
.editGrid .hoursInputs input{width:110px;min-width:0;font-size:14px;font-weight:700;padding:7px 3px}
.editGrid .restLabel{display:flex;align-items:center;justify-content:center;gap:5px;font-size:12px;margin:7px 0 0}
.editGrid .restLabel input{width:16px;height:16px}
.editGrid .totalRow th,.editGrid .totalRow td{background:#ffdf00!important;font-size:17px;font-weight:800;color:#102f5a}
@media(max-width:850px){#table{overflow-x:auto}.editGrid{min-width:850px}}</style></head><body><header style="display:flex;justify-content:space-between;align-items:center"><div><div style="display:flex;align-items:center;gap:10px"><img alt="Logo Croce Gialla" src="https://primary.jwwb.nl/public/s/b/j/temp-jdsqfuxejozahvwvidxb/logo-ridimensionato-no-sfondo-high.png?height=70" style="height:38px;width:38px;object-fit:contain"><h2 style="margin:0">Croce Gialla Emergenza ODV</h2></div><b>Programmazione turni dipendenti</b></div></header><main><section id="work" class="hidden"><div class="row noprint"><label>Settimana dal <input id="week" type="date"></label><button id="load">Carica turni salvati</button><button id="newWeek">Nuova settimana vuota</button><button id="save">Salva turni</button><button id="print">Stampa / PDF</button><button id="back">Torna ad Amministrazione Timbrature</button></div><p id="subtitle"></p><div id="table"></div><p>Nota: turni programmati, non timbrature effettive. Eventuali cambi devono essere approvati dall'amministrazione.</p></section><div id="printSheet" aria-hidden="true"></div><div id="notice" role="status" class="noprint">Verifica accesso amministrativo…</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8"></script><script>
const SB=supabase.createClient("https://ihottewckpwpwqzpxusl.supabase.co","sb_publishable_K7aTp6hLR_Pcpn7UGvArLg_DEgBjlH4",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const API='https://ihottewckpwpwqzpxusl.supabase.co/functions/v1/timbrature-turni-sessione',people=[{badge:'19',name:'Martinoli Andrea'},{badge:'37',name:'Brughera Francesca'},{badge:'39',name:'Farinaccio Greta'}];let cached=[];const $=id=>document.getElementById(id);const dayString=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');const startWeek=d=>{d=new Date(d.getTime());d.setDate(d.getDate()-((d.getDay()+6)%7));return d};const note=s=>$('notice').textContent=s;
async function api(body){const {data:{session}}=await SB.auth.getSession();if(!session)throw Error("Sessione non attiva");const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error||"Errore server");return j}

function buildPrintSheet(){
 const holder=$('printSheet');holder.replaceChildren();
 const heading=document.createElement('h3');heading.textContent='GRIGLIA TURNI DIPENDENTI · '+$('subtitle').textContent;holder.appendChild(heading);
 const base=new Date($('week').value+'T12:00:00'),table=document.createElement('table'),thead=document.createElement('thead'),head=document.createElement('tr');
 const ordered=[people[2],people[0],people[1]],totals=Object.fromEntries(ordered.map(p=>[p.badge,0]));
 for(const label of ['GIORNO',...ordered.map(p=>p.name.toUpperCase())]){const th=document.createElement('th');th.textContent=label;head.appendChild(th)}
 thead.appendChild(head);table.appendChild(thead);const tbody=document.createElement('tbody');
 for(let i=0;i<7;i++){const date=new Date(base);date.setDate(date.getDate()+i);const giorno=dayString(date),tr=document.createElement('tr'),th=document.createElement('th');th.textContent=date.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'}).toUpperCase();tr.appendChild(th);
 for(const p of ordered){const cell=document.querySelector('td[data-badge="'+p.badge+'"][data-giorno="'+giorno+'"]'),td=document.createElement('td');
 if(cell){const inputs=cell.querySelectorAll('input'),a=inputs[0].value,b=inputs[1].value,r=inputs[2].checked;
 if(r){td.textContent='RIPOSO';td.className='rip'}else if(a&&b){td.textContent=a+' – '+b;const [ah,am]=a.split(':').map(Number),[bh,bm]=b.split(':').map(Number);let mins=bh*60+bm-ah*60-am;if(mins<0)mins+=1440;totals[p.badge]+=mins}else td.textContent='—'
 }else td.textContent='—';tr.appendChild(td)}
 tbody.appendChild(tr)}
 const totalRow=document.createElement('tr'),lab=document.createElement('th');lab.textContent='TOTALE ORE';totalRow.appendChild(lab);
 for(const p of ordered){const td=document.createElement('td');td.className='tot';const n=totals[p.badge];td.textContent=Math.floor(n/60)+' ore'+(n%60?' '+String(n%60).padStart(2,'0')+' min':'');totalRow.appendChild(td)}
 tbody.appendChild(totalRow);table.appendChild(tbody);holder.appendChild(table);
 const footer=document.createElement('div');footer.className='foot';footer.textContent='Croce Gialla Emergenza ODV · Orari programmati, soggetti a variazioni autorizzate dall’amministrazione.';holder.appendChild(footer);
}
function render(){
 const begin=new Date($('week').value+'T12:00:00');
 $('subtitle').textContent='Settimana '+begin.toLocaleDateString('it-IT')+' – '+new Date(begin.getTime()+6*86400000).toLocaleDateString('it-IT');
 const order=[people[2],people[0],people[1]],table=document.createElement('table');table.className='editGrid';
 const thead=document.createElement('thead'),head=document.createElement('tr');
 for(const label of ['GIORNO',...order.map(p=>p.name.toUpperCase())]){const th=document.createElement('th');th.textContent=label;head.append(th)}thead.append(head);table.append(thead);
 const tbody=document.createElement('tbody');
 for(let i=0;i<7;i++){
  const d=new Date(begin);d.setDate(d.getDate()+i);const giorno=dayString(d),tr=document.createElement('tr'),th=document.createElement('th');
  th.textContent=d.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'}).toUpperCase();tr.append(th);
  for(const p of order){
   const item=cached.find(t=>t.badge===p.badge&&t.giorno===giorno),td=document.createElement('td');
   td.dataset.badge=p.badge;td.dataset.giorno=giorno;
   const inputs=document.createElement('div');inputs.className='hoursInputs';
   const from=document.createElement('input'),to=document.createElement('input'),check=document.createElement('input');
   from.type='time';to.type='time';check.type='checkbox';from.value=item?.inizio?.slice(0,5)||'';to.value=item?.fine?.slice(0,5)||'';check.checked=!!item?.riposo;
   const dash=document.createElement('span');dash.textContent='–';inputs.append(from,dash,to);
   const lab=document.createElement('label');lab.className='restLabel';lab.append(check,document.createTextNode(' Riposo'));
   td.append(inputs,lab);tr.append(td);
  }tbody.append(tr);
 }
 const totalRow=document.createElement('tr');totalRow.className='totalRow';const totalHead=document.createElement('th');totalHead.textContent='TOTALE ORE';totalRow.append(totalHead);
 for(const p of order){const cell=document.createElement('td');cell.dataset.total=p.badge;totalRow.append(cell)}
 tbody.append(totalRow);table.append(tbody);$('table').replaceChildren(table);updateTotals();
}
function updateTotals(){
 const totals={'19':0,'37':0,'39':0};
 for(const td of document.querySelectorAll('.editGrid td[data-giorno]')){
  const inputs=td.querySelectorAll('input'),a=inputs[0].value,b=inputs[1].value,rest=inputs[2].checked;
  if(rest||!a||!b)continue;
  const st=a.split(':').map(Number),en=b.split(':').map(Number);let mins=en[0]*60+en[1]-st[0]*60-st[1];if(mins<0)mins+=1440;
  totals[td.dataset.badge]+=mins;
 }
 for(const [badge,minutes] of Object.entries(totals)){const el=document.querySelector('[data-total="'+badge+'"]');if(el)el.textContent=minutes?Math.floor(minutes/60)+' ore'+(minutes%60?' '+minutes%60+' min':''):'—'}
}
document.addEventListener('input',e=>{if(e.target.closest('.editGrid'))updateTotals()});
document.addEventListener('change',e=>{if(e.target.closest('.editGrid'))updateTotals()});
function clearWeek(){cached=[];render();note('Griglia vuota pronta per inserire nuovi turni. Nessun turno archiviato è stato cancellato.')}
function nextWeek(){const d=new Date($('week').value+'T12:00:00');d.setDate(d.getDate()+7);$('week').value=dayString(d);clearWeek()}
async function load(){try{const r=await api({action:'load',from:$('week').value});cached=r.turni||[];render();note('Turni caricati.')}catch(e){note(e.message)}}
async function save(){try{const turni=[];for(const td of document.querySelectorAll('td[data-giorno]')){const inputs=td.querySelectorAll('input');const a=inputs[0].value,b=inputs[1].value,r=inputs[2].checked;if(!r&&!a&&!b)continue;if(!r&&(!a||!b))throw Error('Inserire entrambi gli orari per '+td.dataset.giorno);turni.push({badge:td.dataset.badge,giorno:td.dataset.giorno,inizio:a,fine:b,riposo:r})}const r=await api({action:'save',turni});note('Salvati '+r.salvati+' turni. Ora sono disponibili nelle app.');await load()}catch(e){note(e.message)}}
$('week').value=dayString(startWeek(new Date()));$('week').onchange=clearWeek;$('newWeek').onclick=nextWeek;$('load').onclick=load;$('save').onclick=save;$('print').onclick=()=>{buildPrintSheet();window.print()};$('back').onclick=()=>location.href='../timbrature-amministrazione/';(async()=>{try{const {data:{session}}=await SB.auth.getSession();if(!session)throw Error("Login necessario");await api({action:'load',from:$('week').value});$('work').classList.remove('hidden');clearWeek()}catch(e){note("Accesso amministrativo richiesto: torna ad Amministrazione Timbrature ed entra con la password abituale.");const b=document.createElement('button');b.textContent="Torna ad Amministrazione Timbrature";b.onclick=()=>location.href='../timbrature-amministrazione/';$('notice').appendChild(b)}})();
</script></body></html>
