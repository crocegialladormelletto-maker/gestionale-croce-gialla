<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b72"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Pause francesca"><link rel="manifest" href="./manifest-francesca.webmanifest"><link rel="apple-touch-icon" href="./icon-pausa.svg"><title>Pause Francesca Brughera - Croce Gialla</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#17304c;font-family:Arial,sans-serif}header{background:#ffdf00;padding:22px;text-align:center;border-bottom:4px solid #173b72}h1{font-size:23px;margin:5px}.card{background:white;max-width:470px;margin:26px auto;padding:24px;border-radius:18px;box-shadow:0 8px 30px #14243a1a}label{display:block;font-weight:bold;margin:15px 0 7px}select,input,button{width:100%;padding:16px;font-size:18px;border-radius:12px}select,input{border:1px solid #b8c4d3}button{cursor:pointer;border:0;background:#173b72;color:white;font-weight:bold;margin-top:16px}button:disabled{opacity:.35;cursor:not-allowed}.start{background:#eabf30;color:#322500}.end{background:#21704b}#status,#notice{background:#edf2fa;border-radius:10px;padding:13px;margin-top:15px}.hidden{display:none}small{color:#53667c}h2{margin:5px 0 18px}@media(max-width:550px){.card{margin:14px;padding:18px}}</style></head><body><header><h1>🟡 Croce Gialla Emergenza ODV</h1><div>PAUSE DIPENDENTI · SMARTPHONE</div></header><main class="card"><div id="login"><h2>Accesso dipendente</h2><p><strong>Francesca Brughera</strong></p><label>PIN personale</label><input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off"><button id="enter">ACCEDI</button></div><div id="work" class="hidden"><h2 id="name"></h2><div id="status"></div><button id="start" class="start">☕ INIZIO PAUSA</button><button id="end" class="end">▶ FINE PAUSA</button><button id="exit">ESCI DALL'APP</button></div><div id="notice" role="status">Nessuna geolocalizzazione richiesta o registrata.</div><p><small>Le pause sono collegate al gestionale timbrature. Entrata e uscita dal lavoro si timbrano in sede.</small></p></main><script>
const API='https://ihottewckpwpwqzpxusl.supabase.co/functions/v1/timbrature-api';let token='';const $=id=>document.getElementById(id);
async function api(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',...(token?{'x-clock-token':token}:{})},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error||'Errore di comunicazione');return j}
function notice(t){$('notice').textContent=t}

async function login(){try{const r=await api({action:'login_employee',badge:'37',pin:$('pin').value.trim()});token=r.token;$('pin').value='';$('name').textContent=r.nome;$('login').classList.add('hidden');$('work').classList.remove('hidden');await refresh()}catch(e){notice(e.message)}}
async function refresh(){try{const r=await api({action:'pause_data'});const open=!!r.pausa_aperta;$('start').disabled=!r.in_servizio||open;$('end').disabled=!r.in_servizio||!open;$('status').textContent=!r.in_servizio?'Non risulta un turno aperto. Effettua prima la timbratura di entrata in sede.':open?'PAUSA IN CORSO':'In servizio · nessuna pausa in corso'}catch(e){notice(e.message)}}
async function pause(tipo){try{const r=await api({action:'pause_clock',tipo});notice((tipo==='INIZIO_PAUSA'?'Inizio':'Fine')+' pausa salvato alle '+new Date(r.event.evento_at).toLocaleTimeString('it-IT'));await refresh()}catch(e){notice(e.message)}}
async function logout(){try{if(token)await api({action:'logout'})}catch{}token='';$('work').classList.add('hidden');$('login').classList.remove('hidden')}
$('enter').onclick=login;$('start').onclick=()=>pause('INIZIO_PAUSA');$('end').onclick=()=>pause('FINE_PAUSA');$('exit').onclick=logout;
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw-pausa.js').catch(()=>{});}</script></body></html>
