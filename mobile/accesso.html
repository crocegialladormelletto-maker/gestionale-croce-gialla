<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12375d"><title>Direzione Mobile - Accesso</title><style>body{font:16px system-ui;margin:0;background:#f1f5f9;color:#12375d}header{background:#12375d;color:white;padding:18px;border-bottom:5px solid #ffdb17}main{padding:15px;max-width:600px;margin:auto}section{background:white;padding:18px;border-radius:14px;margin:12px 0}label{display:block;font-weight:bold;margin-top:12px}input,select,button{font:inherit;width:100%;padding:13px;border-radius:9px;border:1px solid #bac9d9;box-sizing:border-box;margin-top:7px}button{background:#12375d;color:#fff;font-weight:700}a{color:#12375d}.off{display:none}.day{padding:9px;margin:5px;border:1px solid #b7d6e5;background:#ebf4ff;border-radius:6px}.empty{background:#e4f7e9}</style></head><body><header><b>CROCE GIALLA EMERGENZA ODV</b><div>Direzione Mobile</div></header><main><p id="notice" role="status"></p><section id="login"><h2>Accesso con badge</h2><form id="form"><label>Numero badge<input id="badge" inputmode="numeric" name="badge" autocomplete="off" required></label><label>PIN dell'app volontari<input id="pin" type="password" name="direzione-pin" autocomplete="off" required></label><button>Accedi</button></form><p>Inserisci manualmente il numero badge e il PIN dell'app volontari.</p></section><div id="private" class="off"><section><h2 id="hello"></h2><button id="exit">Esci</button></section><section><h3>Calendario servizi</h3><label>Categoria<select id="category"><option value="tutti">Tutti</option><option value="dimissioni">Dimissioni</option><option value="assistenze">Assistenze</option><option value="ordinari">Servizi ordinari</option></select></label><label>Mese<input id="month" type="month"></label><button id="refresh">Visualizza calendario</button><div id="calendar"></div></section><section><h3>Inserisci nuovo servizio</h3><form id="new"><label>Data<input id="date" type="date" required></label><label>Tipo<select id="type"><option>Dimissione</option><option>Trasferimento</option><option>Visita</option><option>Assistenza manifestazione</option></select></label><label>Ora<input id="time" type="time" required></label><label>Mezzo<select id="vehicle"><option>06</option><option>07</option><option>08</option><option>09</option></select></label><label>Luogo di carico<input id="pickup"></label><label>Destinazione<input id="destination"></label><label>Nome paziente<input id="name"></label><label>Cognome paziente<input id="surname"></label><button>Salva servizio</button></form></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8"></script><script src="./accesso.js"></script></body></html>
