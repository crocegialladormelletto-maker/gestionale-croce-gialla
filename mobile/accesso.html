<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12375d"><title>Direzione Mobile - Accesso</title><style>body{font:16px system-ui;margin:0;background:#f1f5f9;color:#12375d}header{background:#12375d;color:white;padding:18px;border-bottom:5px solid #ffdb17}main{padding:15px;max-width:600px;margin:auto}section{background:white;padding:18px;border-radius:14px;margin:12px 0}label{display:block;font-weight:bold;margin-top:12px}input,select,button{font:inherit;width:100%;padding:13px;border-radius:9px;border:1px solid #bac9d9;box-sizing:border-box;margin-top:7px}button{background:#12375d;color:#fff;font-weight:700}a{color:#12375d}.off{display:none}.day{padding:9px;margin:5px;border:1px solid #b7d6e5;background:#ebf4ff;border-radius:6px}.empty{background:#e4f7e9}button{box-shadow:0 3px 10px #12375d26;border:0;font-weight:850;min-height:48px}#form button{background:#ffdb17;color:#12375d}#refresh{background:#2563eb;color:white}#new button{background:#16803d;color:white}#exit{background:#c62828;color:white}#category{background:#e7efff;border:2px solid #2563eb;font-weight:800}#month{border:2px solid #0e7490}#calendar{margin-top:13px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}#calendar .day{margin:0;padding:7px 2px;background:#dbeafe;color:#12375d;border:1px solid #93c5fd;min-height:62px;font-size:12px;overflow:hidden}#calendar .day strong{display:block;font-size:15px}#calendar .weekday{text-align:center;font-size:11px;font-weight:900;color:#526a7e;padding:6px 0}#calendar .blank{min-height:10px}#calendar .dots{display:flex;gap:2px;justify-content:center;margin-top:5px;flex-wrap:wrap}#calendar .dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:#ea580c}#calendar .dot.assistenza{background:#db2777}#calendar .dot.ordinario{background:#0284c7}#calendar .day.selected{outline:3px solid #12375d}#dayDetails{margin:12px 0;padding:12px;border-radius:10px;background:#eef4fa}#calendar .day.empty{background:#dcfce7;color:#166534;border-color:#86efac}#calendar .day:focus{outline:3px solid #f59e0b}#calendar .detail{grid-column:1/-1;background:#f0f7ff;border-radius:9px;padding:9px}#notice:not(:empty){background:#fff3d0;padding:12px;border-radius:8px;font-weight:750}section{box-shadow:0 2px 12px #12375d15}header{font-size:18px}#calendar{width:100%!important;min-width:0!important;grid-template-columns:repeat(7,minmax(0,1fr))!important;align-items:stretch;gap:4px!important}#calendar>*{min-width:0!important;max-width:100%!important;box-sizing:border-box!important}#calendar .day{width:100%!important;min-width:0!important;max-width:100%!important;height:67px!important;min-height:67px!important;max-height:67px!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;padding:4px 1px!important;margin:0!important;white-space:nowrap!important;text-overflow:clip!important;overflow:hidden!important;line-height:1.2!important}#calendar .day small{font-size:9px!important;display:block!important;white-space:nowrap!important}#calendar .day strong{font-size:15px!important}#calendar .weekday{font-size:11px!important}#dayDetails{word-break:normal;overflow-wrap:break-word}#dayDetails p{padding:8px;background:#fff;border:1px solid #d7e4ef;border-radius:8px;line-height:1.4}main>section{min-width:0;overflow:hidden}@media(max-width:380px){#calendar{gap:3px!important}#calendar .day{height:60px!important;min-height:60px!important;max-height:60px!important}section{padding:12px!important}}</style></head><body><header><b>CROCE GIALLA EMERGENZA ODV</b><div>Direzione Mobile</div></header><main><p id="notice" role="status"></p><section id="login"><h2>Accesso con badge</h2><form id="form"><label>Numero badge<input id="badge" inputmode="numeric" name="badge" autocomplete="off" required></label><label>PIN dell'app volontari<input id="pin" type="password" name="direzione-pin" autocomplete="off" required></label><button>Accedi</button></form><p>Inserisci manualmente il numero badge e il PIN dell'app volontari.</p></section><div id="private" class="off"><section><h2 id="hello"></h2><button id="exit">Esci</button></section><section><h3>Calendario servizi</h3><label>Categoria<select id="category"><option value="tutti">Tutti</option><option value="dimissioni">Dimissioni</option><option value="assistenze">Assistenze</option><option value="ordinari">Servizi ordinari</option></select></label><label>Mese<input id="month" type="month"></label><button id="refresh" type="button">📅 Visualizza calendario</button><p id="calendarStatus" aria-live="polite"></p><div id="calendar"></div><div id="dayDetails">Seleziona una giornata per consultare i servizi.</div><button id="newForDay" type="button" style="background:#15803d;color:white">➕ Inserisci servizio nel giorno selezionato</button></section><section><h3>Inserisci nuovo servizio</h3><form id="new"><label>Data<input id="date" type="date" required></label><label>Tipo<select id="type"><option>Dimissione</option><option>Trasferimento</option><option>Visita</option><option>Assistenza manifestazione</option></select></label><label>Ora partenza<input id="time" type="time" required></label><label>Ora carico paziente<input id="loadTime" type="time"></label><label>Ora arrivo a destinazione<input id="arrivalTime" type="time"></label><label>Ora fine servizio / rientro<input id="endTime" type="time"></label><label>Mezzo<select id="vehicle"><option>06</option><option>07</option><option>08</option><option>09</option></select></label><label>Luogo di carico<input id="pickup"></label><label>Destinazione<input id="destination"></label><label>Nome paziente<input id="name"></label><label>Cognome paziente<input id="surname"></label><button>Salva servizio</button></form></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8"></script><script src="./accesso.js?v=20261014-calendario-pulito4"></script></body></html>
