<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12375d"><title>Direzione Mobile - Accesso</title><style>body{font:16px system-ui;margin:0;background:#f1f5f9;color:#12375d}header{background:#12375d;color:white;padding:18px;border-bottom:5px solid #ffdb17}main{padding:15px;max-width:600px;margin:auto}section{background:white;padding:18px;border-radius:14px;margin:12px 0}label{display:block;font-weight:bold;margin-top:12px}input,select,button{font:inherit;width:100%;padding:13px;border-radius:9px;border:1px solid #bac9d9;box-sizing:border-box;margin-top:7px}button{background:#12375d;color:#fff;font-weight:700}a{color:#12375d}.off{display:none}.day{padding:9px;margin:5px;border:1px solid #b7d6e5;background:#ebf4ff;border-radius:6px}.empty{background:#e4f7e9}button{box-shadow:0 3px 10px #12375d26;border:0;font-weight:850;min-height:48px}#form button{background:#ffdb17;color:#12375d}#refresh{background:#2563eb;color:white}#new button{background:#16803d;color:white}#exit{background:#c62828;color:white}#category{background:#e7efff;border:2px solid #2563eb;font-weight:800}#month{border:2px solid #0e7490}#calendar{margin-top:13px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}#calendar .day{margin:0;padding:12px 5px;background:#dbeafe;color:#12375d;border:2px solid #93c5fd;min-height:62px}#calendar .day.empty{background:#dcfce7;color:#166534;border-color:#86efac}#calendar .day:focus{outline:3px solid #f59e0b}#calendar .detail{grid-column:1/-1;background:#f0f7ff;border-radius:9px;padding:9px}#notice:not(:empty){background:#fff3d0;padding:12px;border-radius:8px;font-weight:750}section{box-shadow:0 2px 12px #12375d15}header{font-size:18px}</style></head><body><header><b>CROCE GIALLA EMERGENZA ODV</b><div>Direzione Mobile</div></header><main><p id="notice" role="status"></p><section id="login"><h2>Accesso con badge</h2><form id="form"><label>Numero
